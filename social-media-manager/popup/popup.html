<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">📱</span>
        <h1>Media Manager</h1>
      </div>
      <div class="platform-badge" id="platformBadge">
        <span class="platform-icon">-</span>
        <span class="platform-name">감지 중...</span>
      </div>
    </header>

    <!-- Status -->
    <div class="status-bar">
      <span id="statusText">상태 확인 중...</span>
      <button id="refreshPage" class="btn-small" title="페이지 새로고침">🔄</button>
    </div>

    <!-- Sort Section -->
    <section class="section">
      <h2 class="section-title">
        <span>📊</span> 정렬
      </h2>

      <div class="sort-controls">
        <div class="form-group">
          <label for="sortBy">정렬 기준</label>
          <select id="sortBy">
            <option value="date">업로드 날짜</option>
            <option value="views">조회수</option>
            <option value="likes">좋아요</option>
            <option value="comments">댓글</option>
            <option value="shares">공유수</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sortOrder">정렬 순서</label>
          <select id="sortOrder">
            <option value="desc">내림차순 (최신/많은순)</option>
            <option value="asc">오름차순 (오래된/적은순)</option>
          </select>
        </div>

        <button id="applySort" class="btn btn-primary">
          <span>✨</span> 정렬 적용
        </button>
      </div>
    </section>

    <!-- Overlay Section -->
    <section class="section">
      <h2 class="section-title">
        <span>👁</span> 오버레이
      </h2>

      <div class="toggle-row">
        <span>정보 오버레이 표시</span>
        <label class="toggle">
          <input type="checkbox" id="showOverlay" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="checkbox-group" id="overlayOptions">
        <label class="checkbox-item">
          <input type="checkbox" value="views" checked>
          <span>👁 조회수</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" value="likes" checked>
          <span>❤️ 좋아요</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" value="comments" checked>
          <span>💬 댓글</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" value="shares">
          <span>🔗 공유</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" value="date" checked>
          <span>📅 날짜</span>
        </label>
      </div>
    </section>

    <!-- Download Section -->
    <section class="section">
      <h2 class="section-title">
        <span>⬇️</span> 다운로드
      </h2>

      <p class="hint">게시물 위에 마우스를 올리면 다운로드 버튼이 표시됩니다.</p>

      <div class="toggle-row">
        <span>워터마크 없이 다운로드</span>
        <label class="toggle">
          <input type="checkbox" id="noWatermark" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </section>

    <!-- Help Section -->
    <section class="section help-section">
      <h2 class="section-title">
        <span>💡</span> 도움말
      </h2>
      <ul class="help-list">
        <li>프로필 페이지에서만 정렬이 작동합니다</li>
        <li>정렬이 안되면 페이지를 새로고침하세요</li>
        <li>콘솔(F12)에서 [SMM] 로그 확인 가능</li>
      </ul>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>TikTok + Instagram</p>
      <p class="version">v1.0.0</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
